apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  # Read-only user. Host / database / sslmode come from setup.yml (via .env); a read replica in production.
  - name: LiteLLM Postgres
    uid: litellm-pg
    type: grafana-postgresql-datasource
    url: $GRAFANA_PG_HOST
    user: grafana_ro
    jsonData:
      database: $LITELLM_DB_NAME
      sslmode: $GRAFANA_PG_SSLMODE
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
    secureJsonData:
      password: $GRAFANA_RO_DB_PASSWORD
