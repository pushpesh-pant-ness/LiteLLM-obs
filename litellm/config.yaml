# LiteLLM proxy config
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # Mock model: no provider key needed, returns a canned answer but is priced as gpt-4o-mini.
  # Use it to smoke-test the whole pipeline (spend, metrics, traces). Remove for production.
  - model_name: mock-gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: not-used
      mock_response: "This is a mock response from the observability smoke test."

  # Always fails (simulated rate limit). verify.py calls it with the master key to prove that
  # retries + fallbacks work (router_settings.fallbacks below). No team can use it.
  - model_name: zz-verify-failing
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: not-used
      mock_response: "litellm.RateLimitError"

  # Real models - uncomment the ones you have keys for (set the key in .env).
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: claude-sonnet
  #   litellm_params:
  #     model: anthropic/claude-sonnet-4-5
  #     api_key: os.environ/ANTHROPIC_API_KEY
  # - model_name: azure-gpt-4o
  #   litellm_params:
  #     model: azure/<your-deployment-name>
  #     api_base: os.environ/AZURE_API_BASE
  #     api_key: os.environ/AZURE_API_KEY
  #     api_version: "2024-10-21"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Keep raw spend logs short; daily aggregate tables are kept separately.
  maximum_spend_logs_retention_period: "30d"
  maximum_spend_logs_retention_interval: "1d"
  # Several LiteLLM instances: queue spend updates in Redis so instances don't fight over DB rows.
  use_redis_transaction_buffer: true

# Shared state for ALL LiteLLM instances (service litellm-redis): rate limits, budgets between DB
# writes, provider cooldowns. Without it every instance counts on its own and limits multiply.
router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  num_retries: 2            # retry a failing provider call twice before falling back
  timeout: 120              # seconds per provider call
  allowed_fails: 3          # failures per minute before a deployment is cooled down
  cooldown_time: 30         # seconds a failing deployment is skipped
  # Fallbacks: when every deployment of a model fails, try these model names in order.
  # Add real ones per model once a 2nd provider key exists, e.g.  - gpt-oss-120b: ["gpt-oss-120b-azure"]
  # (a fallback must be a model the same teams may use - fallbacks skip the team model check).
  fallbacks:
    - zz-verify-failing: ["mock-gpt-4o-mini"]

litellm_settings:
  # Prometheus is registered as a "callback" (it hooks both success and failure).
  # redact_reasoning: also blanks model reasoning text for redacted (sensitive) calls - see the file.
  callbacks: ["prometheus", "redact_reasoning.proxy_handler_instance"]
  success_callback: ["langfuse"]
  # No global Langfuse failure callback on purpose: requests rejected at auth (wrong model,
  # budget exceeded, rate limit) are logged before team settings apply, so a sensitive team's
  # prompt would reach Langfuse unredacted. Instead bootstrap gives EVERY team its own Langfuse
  # success+failure callback (redacting for "sensitive" teams). Rejected requests still appear in
  # Postgres (status=failure), Prometheus and the Grafana error panel.
  failure_callback: []
  # Keep Prometheus label cardinality low: no per-user / per-request labels.
  # (team_alias, api_key_alias, model, requested_model stay - those are bounded.)
  disable_end_user_cost_tracking_prometheus_only: true
  prometheus_exclude_labels: ["client_ip", "user_agent", "user_email", "end_user", "user", "hashed_api_key"]
  # LiteLLM tags every request with its User-Agent by default; keep tags to proj/cc/env.
  disable_add_user_agent_to_request_tags: true
  # Set to true to stop sending prompts/responses to ALL loggers (Langfuse etc).
  # Spend, tokens and latency are still recorded. For one team only, see README.
  turn_off_message_logging: false
