# setup.yml - the one file to fill in. Copy this file to setup.yml, edit it, then run:
#
#     ./scripts/setup.sh            # Git Bash / Linux / macOS - whole setup, ends with verify
#     ./scripts/setup.sh --check    # only validate setup.yml and test the connections
#
# Secrets never go in this file: they live in .env (setup.sh creates it with random values;
# you add the production master key and the database password - see "Secrets" at the bottom).

# attach = connect to the LiteLLM you already run (production). This stack adds Grafana,
#          Prometheus, Alertmanager and Langfuse around it; it does not run a LiteLLM itself.
# local  = also run LiteLLM + its Postgres here (dev / demo / testing a change).
mode: attach

litellm:
  # Address of the production LiteLLM (load balancer is fine) - used for the admin API.
  url: https://litellm.example.internal
  # Every LiteLLM replica, host:port, scraped one by one (NOT the load balancer).
  metrics:
    targets:
      - litellm-1.example.internal:4000
      - litellm-2.example.internal:4000
    scheme: http                  # https if the replicas serve TLS themselves
  ca_file: ""                     # private CA for https, a file in certs/ (e.g. certs/ca-bundle.pem)

  # observe = teams already exist in LiteLLM (normal for production). This stack only adds
  #           a Langfuse trace callback + metadata to each team; budgets, models and keys stay as they are.
  # manage  = create / update teams, budgets, models and keys from the tenants file.
  tenants: observe
  # In bootstrap/. If it does not exist, setup.sh creates it from the teams in LiteLLM and stops so
  # you can add members (who may see which team) and mark sensitive teams.
  tenants_file: tenants.prod.json
  # A team that already has callbacks pointing somewhere else is left alone unless this is true.
  overwrite_team_callbacks: false

# LiteLLM's Postgres. Grafana reads a reporting schema of views in it (no prompts, no keys).
database:
  host: litellm-db.example.internal
  port: 5432
  name: litellm
  sslmode: require                # disable | require | verify-ca | verify-full
  # auto   = setup.sh creates the reporting schema + read-only roles itself, as admin_user
  #          (needs CREATEROLE and CREATE on the database; LiteLLM's own DB user usually has CREATE).
  # manual = setup.sh writes postgres/generated/dba/dba-apply.sql for your DBA to run instead.
  setup: auto
  admin_user: litellm
  # Grafana reads here - a streaming replica keeps dashboards off the primary. Empty = primary.
  read_host: litellm-db-replica.example.internal
  read_port: 5432

# This observability server.
server:
  bind: 0.0.0.0                   # 127.0.0.1 = reachable from this machine only
  grafana_url: http://obs.example.internal:3001
  langfuse_url: http://obs.example.internal:3000
  # How the LiteLLM containers reach Langfuse to send traces (often the same as langfuse_url).
  langfuse_url_for_litellm: http://obs.example.internal:3000
  ports:
    grafana: 3001
    langfuse: 3000
    prometheus: 9090
    alertmanager: 9093

accounts:
  # local = members in the tenants file get Grafana + Langfuse logins with generated passwords
  #         (bootstrap/test-users.json). sso = no local passwords: Langfuse invites by email,
  #         Grafana via Entra ID (docs/PRODUCTION.md, phase 7).
  members: local
  test_viewers: false             # extra viewer-<team> accounts, for testing isolation only

images:
  pull_policy: never              # only images already on this machine (security-cleared)
  litellm: ghcr.io/berriai/litellm:main-stable   # mode: local only

# mode: local only
local:
  litellm_replicas: 2
  litellm_port: 4000

# Secrets (.env, never committed):
#   LITELLM_MASTER_KEY   attach: the production master key, or better a proxy-admin key made for this stack
#   DB_ADMIN_PASSWORD    attach + database.setup auto: password of database.admin_user
#   everything else      generated by setup.sh
