# LiteLLM observability stack
#   Apps -> LiteLLM Proxy -> LLM providers
#             |- Postgres   -> LiteLLM UI + Grafana (cost reports)
#             |- Prometheus -> Grafana (live charts) + Alertmanager (Slack)
#             '- Langfuse   (per-request traces)
#
# Set up with ONE file + ONE command:  setup.yml  ->  ./scripts/setup.sh   (see README)
#   mode: local   everything below, LiteLLM included (this file only)
#   mode: attach  production LiteLLM is used instead: compose.attach.yml switches off the bundled
#                 LiteLLM / Redis / Postgres (setup.sh sets COMPOSE_FILE in .env, so plain
#                 `docker compose ...` picks the right files)
#
# Ports bind to BIND_ADDRESS (default 127.0.0.1).
#
# Images are never pulled automatically (pull_policy: never). Get images cleared by security,
# pull them on purpose, then run with PULL_POLICY=missing once. See README "Images".
#
#   ./scripts/setup.sh                        # everything (render .env, preflight, up, tenants, verify)
#   docker compose up -d                      # after setup: start / update the containers
#   ./scripts/apply-tenants.sh                # after editing the tenants file
#   ./scripts/verify.sh                       # prove it all works (see README)

name: llm-obs

# Every container: rotate logs (10 MB x 3) so a chatty service cannot fill the disk.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  NODE_EXTRA_CA_CERTS: /certs/corp-root-ca.pem
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  # Blob store: defaults to the bundled local-s3 service (files on a local volume).
  # To use real S3 later, set LANGFUSE_S3_* in .env and drop local-s3.
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-local}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-local-secret}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:-http://local-s3:9000}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_FORCE_PATH_STYLE:-true}
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-local}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-local-secret}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:-http://local-s3:9000}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_FORCE_PATH_STYLE:-true}
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD}

services:
  # ---------------------------------------------------------------- core
  postgres:
    logging: *logging
    mem_limit: 1g
    networks: [internal]
    image: postgres:16
    pull_policy: ${PULL_POLICY:-never}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD}
      GRAFANA_RO_DB_PASSWORD: ${GRAFANA_RO_DB_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pg-backups:/backups
    # No host port: only reachable on the internal network. Admin: docker compose exec postgres psql -U postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    logging: *logging
    # Two instances sharing Redis (limits, budgets, cooldowns). Host ports 4000 and 4001;
    # inside the stack, http://litellm:4000 resolves to both. A TLS load balancer goes in front (phase 5).
    deploy:
      replicas: ${LITELLM_REPLICAS:-2}
    mem_limit: 1536m
    networks: [edge, internal]
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    pull_policy: ${PULL_POLICY:-never}
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      SSL_CERT_FILE: /certs/ca-bundle.pem   # public CAs + corp TLS-inspection root (scripts/build-ca-bundle.sh)
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      STORE_MODEL_IN_DB: "True"
      # Use the price list bundled in the image (set False to fetch the latest from GitHub at startup)
      LITELLM_LOCAL_MODEL_COST_MAP: ${LITELLM_LOCAL_MODEL_COST_MAP:-True}
      LANGFUSE_HOST: http://langfuse-web:3000
      REDIS_HOST: litellm-redis   # standard names: also read by the spend transaction buffer
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${LITELLM_REDIS_PASSWORD}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      # Provider keys - leave blank for the ones you don't use
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/redact_reasoning.py:/app/redact_reasoning.py:ro
      - ./certs:/certs:ro
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${LITELLM_PORT:-4000}-${LITELLM_PORT_LAST:-4001}:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      litellm-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot, on every `up`: reporting views + read grants (postgres/sql/*.sql) and the
  # per-team / per-org scopes generated by bootstrap (postgres/generated/*.sql).
  # Local mode: the bundled Postgres as superuser. Attach mode: the production LiteLLM database as
  # setup.yml database.admin_user (postgres/sql/local/ - replication, schema lockdown - is skipped).
  db-setup:
    logging: *logging
    mem_limit: 256m
    networks: [internal]
    image: postgres:16
    pull_policy: ${PULL_POLICY:-never}
    restart: "no"
    environment:
      OBS_MODE: ${OBS_MODE:-local}
      PGHOST: ${DB_ADMIN_HOST:-postgres}
      PGPORT: ${DB_ADMIN_PORT:-5432}
      PGUSER: ${DB_ADMIN_USER:-postgres}
      PGPASSWORD: ${DB_ADMIN_PASSWORD:-${POSTGRES_PASSWORD}}
      PGDATABASE: ${LITELLM_DB_NAME:-litellm}
      PGSSLMODE: ${DB_SSLMODE:-prefer}
      PGAPPNAME: llm-obs-db-setup
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      GRAFANA_RO_DB_PASSWORD: ${GRAFANA_RO_DB_PASSWORD}
    volumes:
      - ./postgres/sql:/sql:ro
      - ./postgres/generated:/generated:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        files="/sql/*.sql"
        [ "$$OBS_MODE" = attach ] || files="$$files /sql/local/*.sql"
        for f in $$files /generated/*.sql; do
          [ -f "$$f" ] || continue
          echo "db-setup: $$f"
          psql -v ON_ERROR_STOP=1 -q -v repl_pw="$$REPLICATION_PASSWORD" -v ro_pw="$$GRAFANA_RO_DB_PASSWORD" -f "$$f"
        done
    depends_on:
      litellm: { condition: service_healthy }

  # Streaming read replica of the gateway DB. Grafana reads here, never the primary.
  postgres-replica:
    logging: *logging
    mem_limit: 512m
    networks: [internal]
    image: postgres:16
    pull_policy: ${PULL_POLICY:-never}
    restart: unless-stopped
    environment:
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg-replica-data:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc 'select pg_is_in_recovery()' | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }

  # Langfuse's own Postgres: Langfuse load can never slow down the gateway DB.
  langfuse-db:
    logging: *logging
    mem_limit: 512m
    networks: [internal]
    image: postgres:16
    pull_policy: ${PULL_POLICY:-never}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
    volumes:
      - lf-pg-data:/var/lib/postgresql/data
      - ./postgres/langfuse-init:/docker-entrypoint-initdb.d:ro
      - lf-pg-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Shared state for the LiteLLM instances. Separate from Langfuse's Redis on purpose.
  litellm-redis:
    logging: *logging
    mem_limit: 256m
    networks: [internal]
    image: redis:7
    pull_policy: ${PULL_POLICY:-never}
    restart: unless-stopped
    command: ["--requirepass", "${LITELLM_REDIS_PASSWORD}", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - litellm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LITELLM_REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------- metrics
  prometheus:
    logging: *logging
    mem_limit: 1g
    networks: [edge]
    image: prom/prometheus:v3.1.0
    pull_policy: ${PULL_POLICY:-never}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/${PROMETHEUS_CONFIG:-prometheus.yml}   # attach mode: generated prometheus.attach.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      # Without this, the first value of every NEW series (new team/key/model combo, or any series
      # after a LiteLLM restart) is invisible to increase()/rate(), so Live spend undercounts.
      # LiteLLM exposes <counter>_created; this makes Prometheus insert a 0 at that time.
      - --enable-feature=created-timestamp-zero-ingestion
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
      - ./certs:/certs:ro
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"]

  alertmanager:
    logging: *logging
    mem_limit: 128m
    networks: [edge]
    image: prom/alertmanager:v0.28.1
    pull_policy: ${PULL_POLICY:-never}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    environment:
      # Trust the corp TLS-inspection root too, or Slack delivery fails with "unknown authority".
      SSL_CERT_DIR: /etc/ssl/certs:/certs
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - am-data:/alertmanager
      - ./certs:/certs:ro
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"]

  grafana:
    logging: *logging
    mem_limit: 512m
    networks: [edge, internal]
    image: grafana/grafana:11.5.2
    pull_policy: ${PULL_POLICY:-never}
    restart: unless-stopped
    environment:
      SSL_CERT_DIR: /etc/ssl/certs:/certs
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GRAFANA_RO_DB_PASSWORD: ${GRAFANA_RO_DB_PASSWORD}
      # Reads the streaming replica (postgres-replica), as role grafana_ro: reporting schema only.
      GRAFANA_PG_HOST: ${GRAFANA_PG_HOST:-postgres-replica:5432}
      GRAFANA_PG_SSLMODE: ${GRAFANA_PG_SSLMODE:-disable}
      LITELLM_DB_NAME: ${LITELLM_DB_NAME:-litellm}
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3001}
    volumes:
      - ./certs:/certs:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus, postgres-replica]

  # ---------------------------------------------------------- traces (Langfuse v3)
  langfuse-web:
    logging: *logging
    mem_limit: 2g
    networks: [edge, internal]
    image: langfuse/langfuse:3
    pull_policy: ${PULL_POLICY:-never}
    profiles: ["traces"]
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      # Listen on all interfaces: with two networks the container hostname only resolves to one.
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      # Sign-up stays off; scripts/apply-tenants.sh opens it briefly only to create local test users.
      AUTH_DISABLE_SIGNUP: ${LANGFUSE_DISABLE_SIGNUP:-true}
      # Headless init: creates org, project, API keys and admin user on first boot
      LANGFUSE_INIT_ORG_ID: llm-obs
      LANGFUSE_INIT_ORG_NAME: LLM Observability
      LANGFUSE_INIT_PROJECT_ID: litellm-proxy
      LANGFUSE_INIT_PROJECT_NAME: litellm-proxy
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    volumes:
      - ./certs:/certs:ro
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${LANGFUSE_PORT:-3000}:3000"]
    depends_on:
      langfuse-db: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      local-s3: { condition: service_healthy }

  langfuse-worker:
    logging: *logging
    mem_limit: 1g
    networks: [internal]
    image: langfuse/langfuse-worker:3
    pull_policy: ${PULL_POLICY:-never}
    profiles: ["traces"]
    restart: unless-stopped
    environment:
      <<: *langfuse-env
    volumes:
      - ./certs:/certs:ro
    depends_on:
      langfuse-db: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      local-s3: { condition: service_healthy }

  # Local S3-compatible blob store for Langfuse (stdlib Python, data on the s3-data volume).
  # No host port: only reachable from inside the compose network.
  local-s3:
    logging: *logging
    mem_limit: 256m
    networks: [internal]
    image: python:3.12-alpine
    pull_policy: ${PULL_POLICY:-never}
    profiles: ["traces"]
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-local}
      S3_BUCKETS: ${LANGFUSE_S3_BUCKET:-langfuse}
      S3_DATA_DIR: /data
    volumes:
      - ./local-s3/local_s3.py:/app/local_s3.py:ro
      - s3-data:/data
    command: ["python", "-u", "/app/local_s3.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9000), 2)"]
      interval: 3s
      timeout: 5s
      retries: 20

  clickhouse:
    logging: *logging
    mem_limit: 2g
    networks: [internal]
    image: clickhouse/clickhouse-server:25.3
    pull_policy: ${PULL_POLICY:-never}
    profiles: ["traces"]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ch-data:/var/lib/clickhouse
      - ch-logs:/var/log/clickhouse-server
      - ch-backups:/backups
      - ./clickhouse/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    logging: *logging
    mem_limit: 512m
    networks: [internal]
    image: redis:7
    pull_policy: ${PULL_POLICY:-never}
    profiles: ["traces"]
    restart: unless-stopped
    command: ["--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 20

  # ---------------------------------------------------------- one-shot tools
  # docker compose run --rm bootstrap   -> creates orgs / teams / budgets / keys from bootstrap/tenants.json
  bootstrap:
    logging: *logging
    mem_limit: 256m
    networks: [edge]
    image: python:3.12-alpine
    pull_policy: ${PULL_POLICY:-never}
    profiles: ["tools"]
    working_dir: /work
    environment:
      OBS_MODE: ${OBS_MODE:-local}
      LITELLM_URL: ${LITELLM_URL:-http://litellm:4000}
      SSL_CERT_FILE: ${LITELLM_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
      TENANTS_MODE: ${TENANTS_MODE:-manage}
      TENANTS_FILE: ${TENANTS_FILE:-tenants.json}
      OVERWRITE_TEAM_CALLBACKS: ${OVERWRITE_TEAM_CALLBACKS:-true}
      LANGFUSE_HOST: ${LANGFUSE_CALLBACK_HOST:-http://langfuse-web:3000}
      LITELLM_DB_NAME: ${LITELLM_DB_NAME:-litellm}
      GRAFANA_PG_SSLMODE: ${GRAFANA_PG_SSLMODE:-disable}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      SCRAPER_TOKEN_FILE: /prom-secrets/litellm_metrics_token
      SCOPES_SQL: /generated/30-scopes.sql
      # tenant_access.py (Grafana orgs, Langfuse orgs/projects) - see scripts/apply-tenants.sh
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      LANGFUSE_ADMIN_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_ADMIN_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
      GRAFANA_PG_HOST: ${GRAFANA_PG_HOST:-postgres-replica:5432}
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      CREATE_TEST_USERS: ${CREATE_TEST_USERS:-true}
      MEMBER_ACCOUNTS: ${MEMBER_ACCOUNTS:-local}
    volumes:
      - ./bootstrap:/work
      - ./certs:/certs:ro
      - ./prometheus/secrets:/prom-secrets
      - ./postgres/generated:/generated
      - ./grafana/dashboards:/dashboards:ro
      - ./alertmanager:/alertmanager
    entrypoint: ["python", "-u", "bootstrap.py"]
    depends_on:
      litellm: { condition: service_healthy }

  # End-to-end checks: docker compose run --rm checks [--real]   (or scripts/verify.sh)
  checks:
    logging: *logging
    mem_limit: 256m
    networks: [edge]
    image: python:3.12-alpine
    pull_policy: ${PULL_POLICY:-never}
    profiles: ["tools"]
    working_dir: /checks
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      OBS_MODE: ${OBS_MODE:-local}
      LITELLM_URL: ${LITELLM_URL:-http://litellm:4000}
      SSL_CERT_FILE: ${LITELLM_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
      TENANTS_FILE: /bootstrap/${TENANTS_FILE:-tenants.json}
      TENANTS_MODE: ${TENANTS_MODE:-manage}
      EXPECT_REPLICA: ${EXPECT_REPLICA:-true}
      LANGFUSE_CALLBACK_HOST: ${LANGFUSE_CALLBACK_HOST:-http://langfuse-web:3000}
    volumes:
      - ./checks:/checks:ro
      - ./certs:/certs:ro
      - ./bootstrap:/bootstrap:ro
      - ./prometheus/secrets:/prom-secrets:ro
    entrypoint: ["python", "-u", "verify.py"]
    depends_on:
      litellm: { condition: service_healthy }

volumes:
  pg-data:
  prom-data:
  am-data:
  grafana-data:
  ch-data:
  ch-logs:
  s3-data:
  pg-backups:
  pg-replica-data:
  litellm-redis-data:
  lf-pg-data:
  lf-pg-backups:
  ch-backups:

networks:
  # edge: services that are published on 127.0.0.1 or need the internet (LiteLLM -> providers,
  # Alertmanager -> Slack). internal: databases and queues - no internet, no host ports.
  edge: {}
  internal:
    internal: true
