# GENERATED by bootstrap/tenant_alerts.py from tenants.json - edit tenants.json, then run
# scripts/apply-tenants.sh. Webhook URLs live in git-ignored files next to this one.
global:
  slack_api_url_file: /etc/alertmanager/slack_webhook_url
  resolve_timeout: 5m

route:
  receiver: platform
  group_by: ["alertname", "team_alias", "model"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 1) everything -> platform channel, then keep matching
    - receiver: platform
      continue: true
    # 2) team-search alerts -> the team's own channel
    - receiver: team-search
      matchers: ['team_alias="team-search"']
    # 2) team-ranking alerts -> the team's own channel
    - receiver: team-ranking
      matchers: ['team_alias="team-ranking"']
    # 2) team-contracts alerts -> the team's own channel
    - receiver: team-contracts
      matchers: ['team_alias="team-contracts"']

receivers:
  - name: platform
    slack_configs:
      - channel: "#llm-alerts"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} {{ .CommonLabels.alertname }} ({{ .Status }})'
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
  - name: team-search
    slack_configs:
      - api_url_file: /etc/alertmanager/slack/team-search.url
        channel: "#llm-alerts-search"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} {{ .CommonLabels.alertname }} ({{ .Status }})'
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
  - name: team-ranking
    slack_configs:
      - api_url_file: /etc/alertmanager/slack/team-ranking.url
        channel: "#llm-alerts-ranking"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} {{ .CommonLabels.alertname }} ({{ .Status }})'
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
  - name: team-contracts
    slack_configs:
      - api_url_file: /etc/alertmanager/slack/team-contracts.url
        channel: "#llm-alerts-contracts"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} {{ .CommonLabels.alertname }} ({{ .Status }})'
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
