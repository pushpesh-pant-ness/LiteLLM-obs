# Attach mode: use the LiteLLM you already run (production) instead of the bundled one.
# Loaded automatically on top of docker-compose.yml when setup.yml says `mode: attach`
# (scripts/setup.sh puts COMPOSE_FILE=docker-compose.yml:compose.attach.yml in .env).
#
#   - the bundled LiteLLM, its Redis, its Postgres and the replica are not started
#     (moved to profile local-gateway, which nothing enables)
#   - db-setup connects to the production LiteLLM database (setup.yml database.*) as admin_user;
#     it runs on `up` only with database.setup: auto (profile db-setup)
#   - Grafana reads database.read_host, Prometheus scrapes litellm.metrics.targets
#     (prometheus/prometheus.attach.yml), bootstrap/checks call litellm.url
services:
  litellm:
    profiles: [local-gateway]
  litellm-redis:
    profiles: [local-gateway]
  postgres:
    profiles: [local-gateway]
  postgres-replica:
    profiles: [local-gateway]

  db-setup:
    profiles: [db-setup]
    networks: !override [edge]   # must reach the production database
    depends_on: !reset {}

  grafana:
    depends_on: !override [prometheus]

  bootstrap:
    depends_on: !reset {}

  checks:
    depends_on: !reset {}
