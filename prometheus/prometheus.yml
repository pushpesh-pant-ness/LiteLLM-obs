global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: litellm
    metrics_path: /metrics/
    # LiteLLM protects /metrics. The bootstrap tool creates a key that may ONLY call /metrics
    # (alias infra-prometheus-scraper-prod) and writes it here. Never put the master key here.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/litellm_metrics_token
    # Every LiteLLM instance: Docker DNS returns one A record per replica.
    dns_sd_configs:
      - names: ["litellm"]
        type: A
        port: 4000
        refresh_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
