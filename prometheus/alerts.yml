# Alert rules for the LiteLLM proxy. Metric names match LiteLLM 1.106.x.
# Thresholds are starting points - tune them after a week of real traffic.
groups:
  - name: litellm-budget
    rules:
      - alert: TeamBudgetAbove80Percent
        expr: |
          # min/max by team: with several LiteLLM instances each one reports the same gauge.
          (max by (team, team_alias) (litellm_team_max_budget_metric) - min by (team, team_alias) (litellm_remaining_team_budget_metric))
            / (max by (team, team_alias) (litellm_team_max_budget_metric) > 0) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.team_alias }} has used {{ $value | humanizePercentage }} of its budget"
          description: "Team {{ $labels.team_alias }} is above 80% of its max budget for the current period. Requests are blocked at 100%."

      - alert: TeamBudgetExhausted
        expr: min by (team, team_alias) (litellm_remaining_team_budget_metric) <= 0 and max by (team, team_alias) (litellm_team_max_budget_metric) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.team_alias }} has hit its budget - requests are being rejected"
          description: "Raise the budget in the LiteLLM UI (Teams) or wait for the budget period to reset."

  - name: litellm-reliability
    rules:
      - alert: LiteLLMErrorRateHigh
        # Share of failed MODEL calls per team over 5 min. Admin/UI routes are excluded: an expired UI
        # login makes dozens of 401s on /key/list etc. that would otherwise page. Needs >= 0.1 req/s.
        expr: |
          (
            sum by (team_alias) (rate(litellm_proxy_failed_requests_metric_total{route=~".*/(chat/completions|completions|embeddings|responses|messages|images/generations|audio/(transcriptions|speech)|rerank|moderations)"}[5m]))
              /
            sum by (team_alias) (rate(litellm_proxy_total_requests_metric_total{route=~".*/(chat/completions|completions|embeddings|responses|messages|images/generations|audio/(transcriptions|speech)|rerank|moderations)"}[5m]))
          ) > 0.05
          and sum by (team_alias) (rate(litellm_proxy_total_requests_metric_total{route=~".*/(chat/completions|completions|embeddings|responses|messages|images/generations|audio/(transcriptions|speech)|rerank|moderations)"}[5m])) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Error rate for {{ $labels.team_alias }} is {{ $value | humanizePercentage }}"
          description: "More than 5% of requests are failing. Check the LiteLLM logs and the Live dashboard's error panel (exception_class tells you why)."

      - alert: LLMProviderFailures
        expr: sum by (api_provider, litellm_model_name) (rate(litellm_deployment_failure_responses_total{api_provider!=""}[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Provider errors from {{ $labels.api_provider }} / {{ $labels.litellm_model_name }}"
          description: "The upstream provider is returning errors (rate limits, outages, bad keys)."

      - alert: LiteLLMLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (le, model_group) (rate(litellm_request_total_latency_metric_bucket[5m]))
          ) > 30
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency for {{ $labels.model_group }} is {{ $value | humanizeDuration }}"
          description: "End-to-end request latency (proxy + provider) p95 is above 30s for 10 minutes."

  - name: litellm-plumbing
    rules:
      - alert: LiteLLMDown
        expr: up{job="litellm"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus cannot scrape LiteLLM"
          description: "The proxy is down, or the metrics token in prometheus/secrets/ is wrong (check Status > Targets in Prometheus)."

      - alert: LiteLLMLoggingFailures
        expr: sum by (callback_name) (increase(litellm_callback_logging_failures_metric_total[15m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "LiteLLM cannot deliver logs to {{ $labels.callback_name }}"
          description: "Traces are being lost (e.g. Langfuse is down). Spend in Postgres is unaffected."
